                                                            <Info size={14} /> No Thumbnail selected. (Will be uploaded as 1.png / 1.jpg inside the project directory)
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                            {/* Slideshow Multiple Drag/Drop */}
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Slideshow Images</label>
                                                <DragDropZone 
                                                    id="slideshow-upload"
                                                    accept="image/*"
                                                    onFileSelect={handleSlideshowSelect}
                                                    icon={ImageIcon}
                                                    placeholder="Add Slideshow Images"
                                                />
                                                
                                                {/* Slideshow Manager Grid */}
                                                {slideshowItems.length > 0 ? (
                                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 mt-4">
                                                        {slideshowItems.map((item, index) => {
                                                            const isUrl = item.type === 'url';
                                                            const imgSource = isUrl ? item.content : URL.createObjectURL(item.content);
                                                            const sizeLabel = isUrl ? 'Live URL' : `${(item.content.size / 1024).toFixed(0)} KB`;
                                                            const indexName = index + 2; // Slideshow starts from 2

                                                            return (
                                                                <div key={item.id} className="bg-slate-950 border border-slate-850 rounded-lg overflow-hidden flex flex-col group relative">
                                                                    <div className="relative aspect-video w-full border-b border-slate-850 bg-slate-900 flex items-center justify-center">
                                                                        <img src={imgSource} className="w-full h-full object-cover" />
                                                                        <div className="absolute top-1 left-1 bg-black/60 px-1.5 py-0.5 rounded text-[8px] font-bold font-mono text-slate-300">
                                                                            #{indexName}
                                                                        </div>
                                                                    </div>
                                                                    <div className="p-2 flex-1 flex flex-col justify-between">
                                                                        <div className="truncate text-[9px] font-semibold text-slate-300">
                                                                            {isUrl ? 'Existing Asset' : item.content.name}
                                                                        </div>
                                                                        <div className="text-[8px] text-slate-500 font-mono mt-0.5">
                                                                            {sizeLabel}
                                                                        </div>
                                                                        
                                                                        {/* Slideshow card action buttons */}
                                                                        <div className="flex justify-between items-center mt-2 pt-1 border-t border-slate-900">
                                                                            <div className="flex gap-1">
                                                                                <button 
                                                                                    type="button" 
                                                                                    onClick={() => moveSlideshowItem(index, -1)} 
                                                                                    disabled={index === 0}
                                                                                    className="p-1 rounded bg-slate-900 text-slate-400 hover:text-slate-200 disabled:opacity-30 disabled:pointer-events-none"
                                                                                >
                                                                                    <ArrowLeft size={10} />
                                                                                </button>
                                                                                <button 
                                                                                    type="button" 
                                                                                    onClick={() => moveSlideshowItem(index, 1)} 
                                                                                    disabled={index === slideshowItems.length - 1}
                                                                                    className="p-1 rounded bg-slate-900 text-slate-400 hover:text-slate-200 disabled:opacity-30 disabled:pointer-events-none"
                                                                                >
                                                                                    <ArrowRight size={10} />
                                                                                </button>
                                                                            </div>
                                                                            <button 
                                                                                type="button" 
                                                                                onClick={() => removeSlideshowItem(item.id)} 
                                                                                className="p-1 rounded bg-slate-900 text-slate-500 hover:text-rose-500"
                                                                            >
                                                                                <Trash2 size={10} />
                                                                            </button>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                ) : (
                                                    <div className="bg-slate-950 border border-slate-850 rounded-lg p-4 text-center text-slate-500 text-xs mt-3 flex items-center justify-center gap-1.5">
                                                        <Info size={14} /> Slideshow is currently empty. Drag images to build the gallery.
                                                    </div>
                                                )}
                                            </div>

                                            {/* Video Toggle & Drag/Drop */}
                                            <div className="border-t border-slate-850 pt-5">
                                                <div className="flex items-center gap-2 mb-4 bg-slate-950/60 p-3.5 border border-slate-850 rounded-xl">
                                                    <input 
                                                        type="checkbox" 
                                                        id="hasVideo" 
                                                        name="hasVideo" 
                                                        checked={formData.hasVideo} 
                                                        onChange={handleInputChange} 
                                                        className="w-4 h-4 text-indigo-600 rounded bg-slate-950 border-slate-850 focus:ring-indigo-500 focus:ring-offset-slate-900 border-slate-800" 
                                                    />
                                                    <label htmlFor="hasVideo" className="text-xs font-semibold text-slate-200 select-none cursor-pointer">
                                                        Project contains Video Content
                                                    </label>
                                                </div>

                                                {formData.hasVideo && (
                                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-5 items-start animate-in fade-in slide-in-from-top-2 duration-150">
                                                        <div>
                                                            <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Project Video file</label>
                                                            <DragDropZone 
                                                                id="video-upload"
                                                                accept="video/*"
                                                                onFileSelect={handleVideoSelect}
                                                                icon={Film}
                                                                placeholder="Upload Video File"
                                                            />
                                                        </div>
                                                        <div className="md:col-span-2">
                                                            <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Video Status</label>
                                                            {videoItem ? (
                                                                <div className="bg-slate-950 border border-slate-850 rounded-lg p-3.5 flex items-center justify-between">
                                                                    <div className="flex items-center gap-3 min-w-0">
                                                                        <div className="w-10 h-10 bg-indigo-500/10 rounded border border-indigo-500/25 flex items-center justify-center text-indigo-400">
                                                                            <Film size={18} />
                                                                        </div>
                                                                        <div className="min-w-0 flex-1">
                                                                            <p className="text-xs font-semibold text-slate-200 truncate">
                                                                                {videoItem.type === 'file' ? videoItem.content.name : 'Existing Live Video'}
                                                                            </p>
                                                                            <p className="text-[10px] text-slate-500 font-mono flex items-center gap-1 mt-0.5">
                                                                                {videoItem.type === 'file' 
                                                                                    ? `${(videoItem.content.size / (1024 * 1024)).toFixed(2)} MB [Upload Queue]` 
                                                                                    : <span className="flex items-center text-indigo-400"><Link2 size={10} className="mr-0.5 flex-shrink-0" /> <span className="truncate">{videoItem.content.substring(0, 50)}...</span></span>
                                                                                }
                                                                            </p>
                                                                        </div>
                                                                    </div>
                                                                    <button 
                                                                        type="button" 
                                                                        onClick={handleVideoRemove} 
                                                                        className="text-slate-500 hover:text-rose-500 p-1.5 rounded hover:bg-slate-900 transition"
                                                                    >
                                                                        <Trash2 size={14} />
                                                                    </button>
                                                                </div>
                                                            ) : (
                                                                <div className="bg-slate-950 border border-slate-850 rounded-lg p-4 text-center text-slate-500 text-xs flex items-center justify-center gap-2">
                                                                    <Info size={14} /> No video file selected. (Will be uploaded as Videos/Project Name.ext in the media repository)
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        {/* Description Textarea */}
                                        <div className="border-t border-slate-850 pt-5">
                                            <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Project Description</label>
                                            <textarea 
                                                name="description" 
                                                rows="3" 
                                                value={formData.description} 
                                                onChange={handleInputChange} 
                                                placeholder="Write project details..."
                                                className="w-full px-3 py-2 bg-slate-950 border border-slate-850 rounded-lg text-slate-100 focus:outline-none focus:border-indigo-500 transition text-xs border-slate-800"
                                            ></textarea>
                                        </div>

                                        {/* Actions */}
                                        <div className="flex gap-4 pt-5 border-t border-slate-850">
                                            <button 
                                                type="button" 
                                                onClick={() => setView('dashboard')} 
                                                className="flex-1 px-4 py-3 bg-slate-900 hover:bg-slate-850 text-slate-300 font-semibold rounded-lg border border-slate-800 transition"
                                            >
                                                Cancel
                                            </button>
                                            <button 
                                                type="submit" 
                                                className="flex-1 px-4 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg shadow-lg shadow-indigo-600/20 transition flex items-center justify-center gap-2"
                                            >
                                                <Upload size={14} />
                                                <span>{isEditing ? 'Commit & Update Project' : 'Commit & Create Project'}</span>
                                            </button>
                                        </div>

                                    </form>
                                </div>
                            )}

                            {/* VIEW: SETTINGS */}
                            {view === 'settings' && (
                                <div className="max-w-xl mx-auto space-y-6">
                                    <div className="bg-slate-900/50 border border-slate-850 p-6 rounded-xl shadow-xl space-y-5">
                                        <h2 className="text-sm font-bold text-slate-100 flex items-center gap-2 pb-3 border-b border-slate-850">
                                            <Settings size={18} className="text-indigo-400" />
                                            <span>Repository Settings</span>
                                        </h2>
                                        
                                        {/* Website Repo Configuration */}
                                        <div className="space-y-4">
                                            <h3 className="text-[10px] font-bold uppercase tracking-wider text-slate-400 border-l-2 border-indigo-500 pl-2">Website Repo (project.js)</h3>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-[10px] font-semibold text-slate-400 mb-1">Owner</label>
                                                    <input type="text" value={ghConfig.owner} onChange={e => setGhConfig({...ghConfig, owner: e.target.value})} className="w-full px-3 py-2 bg-slate-950 border border-slate-850 rounded-lg text-slate-100 text-xs focus:outline-none border-slate-800" />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-semibold text-slate-400 mb-1">Repository Name</label>
                                                    <input type="text" value={ghConfig.repo} onChange={e => setGhConfig({...ghConfig, repo: e.target.value})} className="w-full px-3 py-2 bg-slate-950 border border-slate-850 rounded-lg text-slate-100 text-xs focus:outline-none border-slate-800" />
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-[10px] font-semibold text-slate-400 mb-1">Branch</label>
                                                    <input type="text" value={ghConfig.branch} onChange={e => setGhConfig({...ghConfig, branch: e.target.value})} className="w-full px-3 py-2 bg-slate-950 border border-slate-850 rounded-lg text-slate-100 text-xs focus:outline-none border-slate-800" />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-semibold text-slate-400 mb-1">File Path</label>
                                                    <input type="text" value={ghConfig.path} onChange={e => setGhConfig({...ghConfig, path: e.target.value})} className="w-full px-3 py-2 bg-slate-950 border border-slate-850 rounded-lg text-slate-100 text-xs focus:outline-none border-slate-800" />
                                                </div>
                                            </div>
                                        </div>

                                        {/* Media Repo Configuration */}
                                        <div className="space-y-4 pt-4 border-t border-slate-850">
                                            <h3 className="text-[10px] font-bold uppercase tracking-wider text-slate-400 border-l-2 border-indigo-500 pl-2">Media Assets Repo</h3>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-[10px] font-semibold text-slate-400 mb-1">Owner</label>
                                                    <input type="text" value={mediaConfig.owner} onChange={e => setMediaConfig({...mediaConfig, owner: e.target.value})} className="w-full px-3 py-2 bg-slate-950 border border-slate-850 rounded-lg text-slate-100 text-xs focus:outline-none border-slate-800" />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] font-semibold text-slate-400 mb-1">Repository Name</label>
                                                    <input type="text" value={mediaConfig.repo} onChange={e => setMediaConfig({...mediaConfig, repo: e.target.value})} className="w-full px-3 py-2 bg-slate-950 border border-slate-850 rounded-lg text-slate-100 text-xs focus:outline-none border-slate-800" />
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-semibold text-slate-400 mb-1">Branch</label>
                                                <input type="text" value={mediaConfig.branch} onChange={e => setMediaConfig({...mediaConfig, branch: e.target.value})} className="w-full px-3 py-2 bg-slate-950 border border-slate-850 rounded-lg text-slate-100 text-xs focus:outline-none border-slate-800 w-1/2" />
                                            </div>
                                        </div>

                                        {/* Security Authentication Token */}
                                        <div className="space-y-3 pt-4 border-t border-slate-850">
                                            <h3 className="text-[10px] font-bold uppercase tracking-wider text-slate-400 border-l-2 border-indigo-500 pl-2">GitHub Authorization Token</h3>
                                            <div>
                                                <label className="block text-[10px] font-semibold text-slate-400 mb-1">Personal Access Token (PAT)</label>
                                                <input 
                                                    type="password" 
                                                    value={ghConfig.token} 
                                                    onChange={e => setGhConfig({...ghConfig, token: e.target.value})} 
                                                    placeholder="github_pat_..."
                                                    className="w-full px-3 py-2 bg-slate-950 border border-slate-850 rounded-lg text-slate-100 text-xs focus:outline-none border-slate-800 font-mono placeholder-slate-700" 
                                                />
                                                <p className="text-[9px] text-slate-500 mt-1 leading-normal">
                                                    Requires a token with permissions to read/write contents of public or private repositories.
                                                </p>
                                            </div>
                                        </div>

                                        {/* Actions */}
                                        <button 
                                            onClick={saveSettings} 
                                            className="w-full mt-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg shadow-lg shadow-indigo-600/15 transition text-xs"
                                        >
                                            Save Settings & Reload Data
                                        </button>
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<AdminPanel />);
    </script>
</body>
</html>
