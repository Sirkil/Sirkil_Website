        // ---------------------------------------------------------
        // TYPEWRITER TEXT EFFECT COMPONENT
        // ---------------------------------------------------------
        function TypewriterText({ text }) {
            const [displayText, setDisplayText] = useState('');
            
            useEffect(() => {
                let currentText = '';
                let index = 0;
                setDisplayText('');
                
                const interval = setInterval(() => {
                    if (index < text.length) {
                        currentText += text.charAt(index);
                        setDisplayText(currentText);
                        index++;
                    } else {
                        clearInterval(interval);
                    }
                }, 85); // Speed: 85ms per character
                
                return () => clearInterval(interval);
            }, [text]);
            
            return (
                <span className="typewriter-cursor">{displayText}</span>
            );
        }

        // ---------------------------------------------------------
        // ANIMATED STATS COUNTER COMPONENT
        // ---------------------------------------------------------
        function AnimatedCounter({ target, duration = 2000, suffix = "" }) {
            const [count, setCount] = useState(0);
            
            useEffect(() => {
                let start = 0;
                const end = parseInt(target, 10);
                if (start === end) return;
                
                const totalMs = parseInt(duration, 10);
                const steps = 40; // Smooth updates
                const stepSize = Math.ceil(end / steps);
                const stepInterval = totalMs / steps;
                
                const timer = setInterval(() => {
                    start += stepSize;
                    if (start >= end) {
                        clearInterval(timer);
                        setCount(end);
                    } else {
                        setCount(start);
                    }
                }, stepInterval);
                
                return () => clearInterval(timer);
            }, [target, duration]);
            
            return <span>{count}{suffix}</span>;
        }

        // ---------------------------------------------------------
        // SCROLL FADE IN CONTAINER
        // ---------------------------------------------------------
        function FadeInSection(props) {
            const [isVisible, setVisible] = useState(false);
            const domRef = useRef();
            
            useEffect(() => {
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            setVisible(true);
                        }
                    });
                }, { threshold: 0.05 });
                
                const currentEl = domRef.current;
                if (currentEl) {
                    observer.observe(currentEl);
                }
                
                return () => {
                    if (currentEl) {
                        observer.unobserve(currentEl);
                    }
                    observer.disconnect();
                };
            }, []);

            return (
                <div
                    className={`fade-in-section ${isVisible ? 'is-visible' : ''}`}
                    ref={domRef}
                >
                    {props.children}
                </div>
            );
        }

                                                    className={`portfolio-tab-btn ${filterCategory === 'All' ? 'active' : ''}`}
                                                >
                                                    ALL WORK
                                                </button>
                                                <button 
                                                    onClick={() => setFilterCategory('End to end Event Organization')} 
                                                    className={`portfolio-tab-btn ${filterCategory === 'End to end Event Organization' ? 'active' : ''}`}
                                                >
                                                    EVENTS
                                                </button>
                                                <button 
                                                    onClick={() => setFilterCategory('Concepts & Production')} 
                                                    className={`portfolio-tab-btn ${filterCategory === 'Concepts & Production' ? 'active' : ''}`}
                                                >
                                                    CONCEPTS & PRODUCTION
                                                </button>
                                                <button 
                                                    onClick={() => setFilterCategory('On Ground Activations')} 
                                                    className={`portfolio-tab-btn ${filterCategory === 'On Ground Activations' ? 'active' : ''}`}
                                                >
                                                    ACTIVATIONS
                                                </button>
                                                <button 
                                                    onClick={() => setFilterCategory('Branding')} 
                                                    className={`portfolio-tab-btn ${filterCategory === 'Branding' ? 'active' : ''}`}
                                                >
                                                    BRANDING
                                                </button>
                                            </div>
                                            
                                            <select 
                                                value={sortBy}
                                                onChange={(e) => setSortBy(e.target.value)}
                                                className="filter-menu-tabs-style"
                                            >
                                                <option value="default">Default Sorting</option>
                                                <option value="highest">Highest Rated</option>
                                                <option value="latest">Latest Projects</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="portfolio-masonry-grid">
                                        {filteredProjects.map((p) => (
                                            <div key={p.id} className="work-card animate-fadeIn" onClick={() => setSelectedProject(p)}>
                                                {p.thumbnail ? (
                                                    <img src={p.thumbnail} alt={p.title} className="work-card-img" />
                                                ) : (
                                                    <div className="w-full h-full bg-slate-100 flex items-center justify-center text-slate-400">
                                                        <ImageIcon size={32} />
                                                    </div>
                                                )}
                                                <div className="work-card-overlay">
                                                    <span className="work-card-category">{p.category}</span>
                                                    <h3 className="work-card-title">{p.title}</h3>
                                                    <p className="work-card-meta">{p.country} {p.date ? `• ${p.date}` : ''}</p>
                                                </div>
                                                {p.hasVideo && (
                                                    <div className="work-card-badge">
                                                        <Film size={14} />
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                        {filteredProjects.length === 0 && (
                                            <div className="col-span-full py-16 text-center text-slate-500">
                                                No projects found for the selected category.
                                            </div>
                                        )}
                                    </div>
                                </FadeInSection>
                            </div>
                        )}

                        {/* VIEW: CONTACT */}
                        {activePage === 'contact' && (
                            <div className="page-enter section">
                                <FadeInSection>
                                    <div className="contact-layout-grid">
                                        <div className="contact-details-box">
                                            <div className="contact-card-info">
                                                <h3 className="contact-details-title">GET IN TOUCH</h3>
                                                <div className="contact-info-list">
                                                    <div className="contact-info-block">
                                                        <div className="contact-icon-wrapper">
                                                            <MapPin size={18} />
                                                        </div>
                                                        <div className="contact-info-text">
                                                            <h4>Headquarters</h4>
                                                            <p>Family Park, Suez Road, Cairo, Egypt</p>
                                                        </div>
                                                    </div>
                                                    <div className="contact-info-block">
                                                        <div className="contact-icon-wrapper">
                                                            <Mail size={18} />
                                                        </div>
                                                        <div className="contact-info-text">
                                                            <h4>Email Support</h4>
                                                            <p>info@sirkil.com<br />sales@sirkil.com</p>
                                                        </div>
                                                    </div>
                                                    <div className="contact-info-block">
                                                        <div className="contact-icon-wrapper">
                                                            <Phone size={18} />
                                                        </div>
                                                        <div className="contact-info-text">
                                                            <h4>Phone Line</h4>
                                                            <p>+20 2 9876 5432<br />+966 11 234 5678</p>
                                                        </div>
                                                    </div>
                                                    <div className="contact-info-block">
                                                        <div className="contact-icon-wrapper">
                                                            <Clock size={18} />
                                                        </div>
                                                        <div className="contact-info-text">
                                                            <h4>Business Hours</h4>
                                                            <p>Sunday – Thursday<br />9:00 AM – 6:00 PM</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div>
                                                <h4 className="socials-title">Follow Sirkil</h4>
                                                <div className="socials-flex">
                                                    <a href="#" className="social-circle-btn" aria-label="Facebook">
                                                        <Facebook size={16} />
                                                    </a>
                                                    <a href="#" className="social-circle-btn" aria-label="Instagram">
                                                        <Instagram size={16} />
                                                    </a>
                                                    <a href="#" className="social-circle-btn" aria-label="LinkedIn">
                                                        <Linkedin size={16} />
                                                    </a>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Feedback form */}
                                        <div className="contact-form-panel">
                                            {formStatus === 'submitted' ? (
                                                <div className="form-success-container flex flex-col items-center justify-center space-y-4">
                                                    <div className="w-16 h-16 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center mb-2">
                                                        <Check size={32} />
                                                    </div>
                                                    <h3 className="text-lg font-bold text-slate-900">Thank You!</h3>
                                                    <p className="text-slate-500 text-xs leading-relaxed max-w-sm">
                                                        Your contact message has been sent successfully. A project consultant will review your message and reply via email within 24 hours.
                                                    </p>
                                                    <button 
                                                        onClick={() => setFormStatus('idle')} 
                                                        className="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg text-white transition mt-4"
                                                    >
                                                        Send Another Message
                                                    </button>
                                                </div>
                                            ) : (
                                                <form onSubmit={handleFormSubmit}>
                                                    <h3 className="text-lg font-bold mb-6 text-slate-800">Send us a Message</h3>
                                                    
                                                    <div className="form-group-grid">
                                                        <div className="form-group">
                                                            <label>Your Name</label>
                                                            <input 
                                                                type="text" 
                                                                required
                                                                value={formState.name}
                                                                onChange={e => setFormState({...formState, name: e.target.value})}
                                                                className="form-input-field" 
                                                                placeholder="e.g. John Doe"
                                                            />
                                                        </div>
                                                        <div className="form-group">
                                                            <label>Email Address</label>
                                                            <input 
                                                                type="email" 
                                                                required
                                                                value={formState.email}
                                                                onChange={e => setFormState({...formState, email: e.target.value})}
                                                                className="form-input-field" 
                                                                placeholder="john@example.com"
                                                            />
                                                        </div>
                                                    </div>

                                                    <div className="form-group">
                                                        <label>Subject</label>
                                                        <input 
                                                            type="text" 
                                                            required
                                                            value={formState.subject}
                                                            onChange={e => setFormState({...formState, subject: e.target.value})}
                                                            className="form-input-field" 
                                                            placeholder="How can we help you?"
                                                        />
                                                    </div>

                                                    <div className="form-group">
                                                        <label>Message Details</label>
                                                        <textarea 
                                                            rows="5" 
                                                            required
                                                            value={formState.message}
                                                            onChange={e => setFormState({...formState, message: e.target.value})}
                                                            className="form-input-field" 
                                                            placeholder="Describe your event or branding requirements..."
                                                        ></textarea>
                                                    </div>

                                                    <button 
                                                        type="submit" 
                                                        disabled={formStatus === 'submitting'}
                                                        className="btn-form-submit"
                                                    >
                                                        {formStatus === 'submitting' ? (
                                                            <RefreshCw size={14} className="animate-spin" />
                                                        ) : (
                                                            <>
                                                                <span>Send Inquiry</span>
                                                                <ArrowRight size={14} />
                                                            </>
                                                        )}
                                                    </button>
                                                </form>
                                            )}
                                        </div>
                                    </div>
                                </FadeInSection>
                            </div>
                        )}

                    </div>

                    {/* DYNAMIC INLINE DETAIL MODAL */}
                    {selectedProject && (
                        <ProjectDetailModal 
                            project={selectedProject} 
                            onClose={() => setSelectedProject(null)} 
                        />
                    )}

                    {/* FOOTER */}
                    <footer className="footer">
                        <img src="assets/Sirkil Logo.png" alt="Sirkil Logo" className="footer-logo" />
                        <p className="footer-copy">&copy; {new Date().getFullYear()} Sirkil Experiential Agency. All rights reserved.</p>
                    </footer>

                </div>
            );
        }

        // Project Detail Modal Inner Component
        function ProjectDetailModal({ project, onClose }) {
            const [currentSlide, setCurrentSlide] = useState(0);
            const slides = project.slideshow || [];
            
            // Format video URL
            const videoUrl = useMemo(() => {
                let url = project.videoUrl || project.video || "";
                if (url.includes("github.com") && url.includes("/blob/")) {
                    url = url.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/");
                }
                return url;
            }, [project]);

            // Handle slide indicators
            const handlePrevSlide = (e) => {
                e.stopPropagation();
                setCurrentSlide(prev => (prev === 0 ? slides.length - 1 : prev - 1));
            };

            const handleNextSlide = (e) => {
                e.stopPropagation();
                setCurrentSlide(prev => (prev === slides.length - 1 ? 0 : prev + 1));
            };

            return (
                <div className="modal-backdrop" onClick={onClose}>
                    <div className="modal-content-card animate-in fade-in zoom-in-95 duration-200" onClick={e => e.stopPropagation()}>
                        
                        <button className="modal-close-btn" onClick={onClose}>
                            <X size={18} />
                        </button>

                        <div className="modal-body">
                            
                            {/* Slideshow Image Slider */}
                            {slides.length > 0 && (
                                <div className="modal-slider-container mb-6">
                                    <div className="modal-slider-box">
                                        <div className="modal-slide">
                                            <img src={slides[currentSlide]} alt="" />
                                        </div>
                                        {slides.length > 1 && (
                                            <>
                                                <button className="modal-slider-arrow left" onClick={handlePrevSlide}>
                                                    <ChevronLeft size={20} />
                                                </button>
                                                <button className="modal-slider-arrow right" onClick={handleNextSlide}>
                                                    <ChevronRight size={20} />
                                                </button>
                                            </>
                                        )}
                                    </div>
                                    {slides.length > 1 && (
                                        <div className="modal-slider-dots">
                                            {slides.map((_, idx) => (
                                                <button 
                                                    key={idx} 
                                                    className={`modal-slider-dot ${idx === currentSlide ? 'active' : ''}`}
                                                    onClick={() => setCurrentSlide(idx)}
                                                />
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* Project Header details split */}
                            <div className="modal-header-section">
                                <div className="modal-header-left">
                                    <h2 className="modal-project-title">{project.title}</h2>
                                    <p className="modal-project-desc">{project.description || "Experiential brand structure crafted and manufactured for premium visual statement and consumer activations."}</p>
                                </div>
                                <div className="modal-info-panel">
                                    <div className="modal-info-row">
                                        <span className="modal-info-label">Client</span>
                                        <span className="modal-info-value">{project.client || "N/A"}</span>
                                    </div>
                                    <div className="modal-info-row">
                                        <span className="modal-info-label">Category</span>
                                        <span className="modal-info-value truncate max-w-[150px]" title={project.category}>{project.category}</span>
                                    </div>
                                    <div className="modal-info-row">
                                        <span className="modal-info-label">Location</span>
                                        <span className="modal-info-value">{project.country || "KSA"}</span>
                                    </div>
                                    <div className="modal-info-row">
                                        <span className="modal-info-label">Year</span>
                                        <span className="modal-info-value">
                                            {project.year || (project.date ? new Date(project.date).getFullYear() : "N/A")}
                                        </span>
                                    </div>
                                </div>
                            </div>

                            {/* Video Player */}
                            {project.hasVideo && videoUrl && (
                                <div className="modal-media-block">
                                    <video controls autoPlay muted playsInline src={videoUrl}></video>
                                </div>
                            )}
                        </div>

                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
