<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio - Sirkil Agency</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #97fbbf;       /* Sirkil Mint Green */
      --primary-hover: #7ae2aa; /* Slightly darker Mint Green for hover states */
      --accent: #97fbbf;        /* Mint Green Accent */
      --bg-light: #ffffff;      /* Pure white background */
      --panel-light: #ffffff;   /* Pure white card backgrounds */
      --border-light: #e2e8f0;  /* Soft borders */
      --text-dark: #000000;     /* Deep black text */
      --text-muted: #4b5563;    /* Dark slate/gray text for readability */
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-light);
      color: var(--text-dark);
      margin: 0;
      padding: 20px 4%;
    }

    /* Header & Filters Layout */
    .portfolio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px auto 40px;
      max-width: 1400px;
      gap: 20px;
    }

    .portfolio-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .portfolio-tab {
      padding: 8px 16px;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: var(--transition);
    }

    .portfolio-tab:hover {
      color: var(--text-dark);
      background-color: rgba(0, 0, 0, 0.02);
    }

    .portfolio-tab.active {
      color: var(--text-dark);
      background-color: rgba(151, 251, 191, 0.2);
      border-bottom: 2px solid var(--primary);
    }

    .filter-menu {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-light);
      background-color: var(--panel-light);
      color: var(--text-dark);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: var(--transition);
    }

    .filter-menu:focus {
      border-color: var(--primary);
    }

    /* Responsive Grid Layout */
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Cards */
    .portfolio-item {
      position: relative;   
      background-color: var(--panel-light);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 1 / 1;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
      transition: var(--transition);
    }

    .portfolio-item:hover {
      transform: translateY(-4px) scale(1.01);
      border-color: var(--primary);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.08);
    }

    .portfolio-item img,
    .portfolio-item video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover; 
      transition: var(--transition);
    }

    .portfolio-item:hover img {
      transform: scale(1.06);
    }

    .portfolio-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.85) 0%, rgba(15, 23, 42, 0.1) 60%, transparent 100%);
      color: #fff;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
      transition: var(--transition);
      z-index: 2;
      box-sizing: border-box;
    }

    .portfolio-item:hover .portfolio-overlay { 
      opacity: 1; 
    }

    .portfolio-title-text {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
    }

    .portfolio-category-text {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    /* Video Play Badge */
    .play-icon {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      z-index: 3;
      border: 1px solid var(--border-light);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      color: var(--text-dark);
      font-size: 11px;
      transition: var(--transition);
    }

    .portfolio-item:hover .play-icon {
      background-color: var(--primary);
      color: var(--text-dark);
      border-color: var(--primary);
    }

    /* Error Message Panel */
    .error-panel {
      text-align: center;
      padding: 50px 20px;
      background: var(--panel-light);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      max-width: 600px;
      margin: 40px auto;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
    }

    .error-panel h3 {
      font-size: 18px;
      color: var(--text-dark);
      margin-bottom: 10px;
    }

    .error-panel p {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* Responsive Queries */
    @media (max-width: 768px) {
      .portfolio-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
      .portfolio-tabs {
        width: 100%;
      }
      .filter-menu {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div id="app"></div>

  <!-- Load Local project.js relative to file (for both local and deployed states) -->
  <script src="project.js"></script>

  <script>
    const app = document.getElementById("app");
    const categories = ["All", "End to end Event Organization", "On Ground Activations", "Branding", "Concepts & Production"];

    // Safety check if project.js is successfully loaded
    if (typeof projectsData === 'undefined') {
      const errorDiv = document.createElement("div");
      errorDiv.className = "error-panel";
      errorDiv.innerHTML = `
        <h3>projectsData is missing</h3>
        <p>Could not locate the <code>project.js</code> file. Please make sure that <code>project.js</code> is in the same directory as this HTML file, or that it has been populated by the Admin Panel.</p>
      `;
      app.appendChild(errorDiv);
    } else {
      initializePortfolio();
    }

    function initializePortfolio() {
      // HEADER (Tabs + Filter)
      const header = document.createElement("div");
      header.className = "portfolio-header";
      app.appendChild(header);

      // Tabs container
      const tabsContainer = document.createElement("div");
      tabsContainer.className = "portfolio-tabs";
      header.appendChild(tabsContainer);

      // Filter Dropdown
      const filterSelect = document.createElement("select");
      filterSelect.className = "filter-menu";
      filterSelect.innerHTML = `
        <option value="default">Default Sorting</option>
        <option value="highest">Highest Rated</option>
        <option value="latest">Latest Projects</option>
      `;
      header.appendChild(filterSelect);

      // Grid
      const grid = document.createElement("div");
      grid.className = "portfolio-grid";
      app.appendChild(grid);

      // Render Tabs
      categories.forEach(cat => {
        const tab = document.createElement("div");
        tab.className = "portfolio-tab";
        // Shorten labels on tabs
        let label = cat;
        if (cat === "End to end Event Organization") label = "Events";
        if (cat === "Concepts & Production") label = "Concepts & Production";
        if (cat === "On Ground Activations") label = "Activations";
        
        tab.textContent = label;
        tab.onclick = () => filterProjects(cat);
        tabsContainer.appendChild(tab);
      });
      document.querySelectorAll(".portfolio-tab")[0].classList.add("active");

      // --- Helper to shuffle ---
      function shuffleArray(arr) {
        return arr
          .map(a => ({ sort: Math.random(), value: a }))
          .sort((a, b) => a.sort - b.sort)
          .map(a => a.value);
      }

      function getVideoUrl(p) {
        let videoUrl = p.videoUrl || p.video || p.videoURL || p.video_link || "";
        if (!videoUrl) return "";
        if (videoUrl.includes("github.com") && videoUrl.includes("/blob/")) {
          videoUrl = videoUrl
            .replace("github.com", "raw.githubusercontent.com")
            .replace("/blob/", "/");
        }
        return videoUrl;
      }

      function renderProjects(list) {
        grid.innerHTML = "";
        list.forEach(p => {
          const item = document.createElement("div");
          item.className = "portfolio-item";
          
          item.onclick = () => {
            const detailsUrl = `project-details.html?id=${p.id}`;
            // Opens in a new tab (Safest for Weebly iframes)
            window.open(detailsUrl, '_blank');
          };

          const hasVid = !!getVideoUrl(p) || !!p.hasVideo;

          item.innerHTML = `
            <img src="${p.thumbnail}" alt="${p.title}" loading="lazy">
            <div class="portfolio-overlay">
              <span class="portfolio-category-text">${p.category}</span>
              <h3 class="portfolio-title-text">${p.title}</h3>
            </div>
            ${hasVid ? '<div class="play-icon" title="Play Video">▶</div>' : ''}
          `;
          grid.appendChild(item);

          if (hasVid) {
            const playIcon = item.querySelector(".play-icon");
            playIcon.addEventListener("click", (e) => {
              e.stopPropagation();
              const primary = getVideoUrl(p);
              const candidates = [];
              if (primary) {
                candidates.push(primary);
                if (primary.includes("/Videos/")) candidates.push(primary.replace("/Videos/", "/videos/"));
                if (primary.includes("/videos/")) candidates.push(primary.replace("/videos/", "/Videos/"));
              }
              const video = document.createElement("video");
              video.setAttribute("controls", "");
              video.setAttribute("playsinline", "");
              video.setAttribute("autoplay", "");
              video.setAttribute("preload", "metadata");
              video.style.width = "100%";
              video.style.height = "100%";
              video.style.objectFit = "cover";
              video.crossOrigin = "anonymous";

              const source = document.createElement("source");
              source.type = "video/mp4";
              source.src = candidates.shift() || "";
              video.appendChild(source);

              const overlay = item.querySelector(".portfolio-overlay");

              item.innerHTML = "";
              item.appendChild(video);
              item.appendChild(overlay);

              const tryNext = () => {
                if (candidates.length) {
                  source.src = candidates.shift();
                  video.load();
                  video.play().catch(()=>{});
                } else {
                  item.innerHTML = `
                    <img src="${p.thumbnail}" alt="${p.title}">
                    <div class="portfolio-overlay">
                      <span class="portfolio-category-text">${p.category}</span>
                      <h3 class="portfolio-title-text">${p.title}</h3>
                    </div>
                  `;
                }
              };

              video.addEventListener("error", tryNext, { once: false });
              video.play().catch(() => {});
            });
          }
        });
      }

      // --- Filtering ---
      window.filterProjects = function(category) {
        document.querySelectorAll(".portfolio-tab").forEach(t => t.classList.remove("active"));
        
        // Match tab by short or long category name
        const tabs = document.querySelectorAll(".portfolio-tab");
        tabs.forEach(t => {
          const txt = t.textContent;
          if (
            (txt === "Events" && category === "End to end Event Organization") ||
            (txt === "Concepts & Production" && category === "Concepts & Production") ||
            (txt === "Activations" && category === "On Ground Activations") ||
            (txt === "Branding" && category === "Branding") ||
            (txt === "All" && category === "All")
          ) {
            t.classList.add("active");
          }
        });

        let list = category === "All"
          ? [...projectsData]
          : projectsData.filter(p => p.category === category);

        // Apply filter select
        const filterType = filterSelect.value;

        if (filterType === "highest") {
          list = [...list].sort((a, b) => (b.rating || 0) - (a.rating || 0));
        } else if (filterType === "latest") {
          list = [...list].sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
        } else {
          list = shuffleArray(list);
        }

        renderProjects(list);
      }

      // Re-filter when dropdown changes
      filterSelect.addEventListener("change", () => {
        const activeTab = document.querySelector(".portfolio-tab.active").textContent;
        let mappedCat = activeTab;
        if (activeTab === "Events") mappedCat = "End to end Event Organization";
        if (activeTab === "Activations") mappedCat = "On Ground Activations";
        filterProjects(mappedCat);
      });

      // Initially render all projects
      filterProjects("All");
    }
  </script>
</body>
</html>
